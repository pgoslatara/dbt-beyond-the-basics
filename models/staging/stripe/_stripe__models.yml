version: 2

models:
  - name: stg_stripe__payments
    description: Table of sample payment data
    columns:
      - name: payment_id
        description: The unique identifier for the payment
        tests:
          - unique
          - not_null
      - name: order_id
        description: The order ID associated with the payment
        tests:
          - not_null
      - name: payment_method
        description: The payment method used for the payment
        tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
          - not_null
      - name: is_voucher
        description: Whether the payment is a voucher
        tests:
          - not_null
      - name: amount
        description: The amount of the payment in dollars
        tests:
          - not_null

unit_tests:
  - name: payment_method
    model: stg_stripe__payments
    given:
      - input: ref('seed_stripe__payments')
        rows:
          - {id: 1, payment_method: 'credit_card'}
          - {id: 2, payment_method: 'coupon'}
          - {id: 3, payment_method: 'bank_transfer'}
          - {id: 4, payment_method: 'gift_card'}
          - {id: 5, payment_method: 'cash'}
    expect:
      rows:
        - {payment_id: 1, is_voucher: false}
        - {payment_id: 2, is_voucher: true}
        - {payment_id: 3, is_voucher: false}
        - {payment_id: 4, is_voucher: true}
        - {payment_id: 5, is_voucher: false}
