[project]
authors = [{name="Padraic Slattery",email="pgoslatara@gmail.com"}]
dependencies=[
  "dbt-core (>=1.9.0,<1.10.0)",
  "dbt-bigquery (>=1.9.0,<1.10.0)"
]
description = "Showcase of advanced use cases relating to CI in dbt"
keywords = [
  "python",
  "sql",
  "Continuous Integration",
  "dbt",
]
license ="MIT"
maintainers = [{name="Padraic Slattery",email="pgoslatara@gmail.com"}]
name = "dbt-beyond-the-basics"
package-mode = false
readme = "README.md"
repository = "https://github.com/pgoslatara/dbt-beyond-the-basics"
requires-python = ">=3.11,<3.12"
version = "0.0.0"

[tool.black]
line-length = 99
include = '/project$|\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.eggs
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vscode
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"

[tool.sqlfmt]
exclude=["target/**/*", "dbt_packages/**/*"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
autoflake = "*"
black = "*"
dbt-artifacts-parser = ">=0.8"
dbt-bouncer = ">=1.11.0"
dbt-coverage = "*"
dbterd = "*"
duckdb = "*"
flake8 = "*"
GitPython = "*"
google-cloud-bigquery = "*"
google-cloud-storage = "*"
isort = "*"
mermaid-py = "*"
pre-commit = "*"
pyarrow = "*"
pytablewriter = "*"
pytest = "*"
pytest-xdist = "*"
pyupgrade = "*"
retry = "*"
"shandy-sqlfmt" = {version = "*", extras=["shandy-sqlfmt[jinjafmt]"]}

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
